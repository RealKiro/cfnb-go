# docker-compose.yml
# 位置：deploy/ 目录；镜像一律从 GHCR 拉取，不支持本地构建
#
# 运行时数据都在同目录的 data/ 下（路径只用一个点，base 是本文件所在目录）：
#   data/config.json  仓库自带模板，改好令牌即可
#   data/ip.txt       仓库自带空白文件，程序运行后写入优选结果
#
# 为什么必须显式设置 create_host_path: false？
#   Docker 短语法 bind mount 在宿主路径不存在时「总是创建为目录」，
#   于是容器内 /app/ip.txt 会变成目录，程序写入时报 is a directory，
#   并跳过 Cloudflare DNS 更新与 GitHub 同步。
#   本文件改用长语法并显式设置 create_host_path: false，
#   路径缺失时会在启动阶段直接报错，而不是静默建目录。
#
# 镜像来源由两个环境变量决定（支持 deploy/.env，参考 deploy/.env.example）：
#   CFNB_IMAGE        默认 ghcr.io/realkiro/cfnb-go:latest（官方镜像，开箱即用）
#   CFNB_PULL_POLICY  默认 missing（本地无缓存时才拉取）
#
# 使用（在 deploy/ 目录下执行）：
#   docker compose up -d            拉取官方镜像并启动
#   docker compose logs -f          查看日志
#   用自己 fork 的镜像：CFNB_IMAGE=ghcr.io/<你的用户名>/cfnb-go:latest docker compose up -d
#
# 路径说明：volumes 的相对路径基于「本文件所在目录」解析（本文件在 deploy/），
# 因此 ./data/ 即 deploy/data/；compose 规范要求相对路径必须以 . 或 .. 开头。
#
# 也可从仓库根执行：docker compose -f deploy/docker-compose.yml up -d

services:
  cfnb:
    # 未设置 CFNB_IMAGE 时使用官方镜像（realkiro 的 GHCR 仓库）
    image: "${CFNB_IMAGE:-ghcr.io/realkiro/cfnb-go:latest}"
    # 拉取策略：missing = 仅在本地无该镜像时拉取；always = 每次 up 检查更新；
    # never = 只用本地已有镜像，不联网
    pull_policy: "${CFNB_PULL_POLICY:-missing}"
    container_name: cfnb-go
    restart: unless-stopped
    environment:
      - RUN_INTERVAL=300              # 每 5 分钟运行一次；0 = 只运行一次
      - TZ=Asia/Shanghai
      # - CFNB_CONFIG=/app/config.json  # 可选：显式指定配置文件路径
    volumes:
      # 主配置（含 Cloudflare / WxPusher / GitHub 令牌）；仓库自带，不会缺失
      - type: bind
        source: ./data/config.json
        target: /app/config.json
        bind:
          create_host_path: false
      # 优选结果持久化；仓库自带空白文件，程序会覆盖写入
      - type: bind
        source: ./data/ip.txt
        target: /app/ip.txt
        bind:
          create_host_path: false
      # 以下两项启用 IP 地区校准时取消注释（需自行创建对应文件）
      # - type: bind
      #   source: ./data/valid_tokens.txt
      #   target: /app/valid_tokens.txt
      #   bind:
      #     create_host_path: false
      # - type: bind
      #   source: ./data/ipinfo_cache.txt
      #   target: /app/ipinfo_cache.txt
      #   bind:
      #     create_host_path: false
