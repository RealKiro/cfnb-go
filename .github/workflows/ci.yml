name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ============ 阶段一：静态检查 + 单元测试 + 交叉编译验证 ============
  test:
    name: 代码检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: go vet 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test -v ./...

      - name: 交叉编译验证（amd64 + arm64）
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/cfnb-amd64 ./cmd/cfnb
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/cfnb-arm64 ./cmd/cfnb
          ls -lh /tmp/cfnb-amd64 /tmp/cfnb-arm64

      - name: 二进制冒烟测试（版本与帮助输出）
        run: |
          mkdir -p /tmp/smoke && cp deploy/data/config.json /tmp/smoke/ && cp /tmp/cfnb-amd64 /tmp/smoke/cfnb
          cd /tmp/smoke
          ./cfnb --version
          ./cfnb --help | head -5

      - name: 校验 compose 可解析（含变量默认值插值）
        run: |
          set -eu
          assert_contains() {
            if grep -q -- "$1" "$2"; then echo "  OK   $1"; else echo "  FAIL 期望包含: $1"; exit 1; fi
          }

          echo "=== 原始 compose 文件断言（剥掉注释行后做字面量匹配）==="
          # 为什么不在 `docker compose config` 的输出上断言？
          # 实测该命令的归一化输出**不含** bind.create_host_path（计数为 0），
          # 长语法 / create_host_path 只能在源文件上校验。
          ACTIVE=/tmp/compose-active.yml
          grep -vE "^[[:space:]]*#" deploy/docker-compose.yml > "$ACTIVE"

          assert_active() {
            if grep -qF -- "$1" "$ACTIVE"; then echo "  OK   $1"; else echo "  FAIL 期望包含: $1"; exit 1; fi
          }

          assert_active "type: bind"
          assert_active "source: ./data/config.json"
          assert_active "source: ./data/ip.txt"
          assert_active "target: /app/config.json"
          assert_active "target: /app/ip.txt"
          assert_active "create_host_path: false"

          COUNT=$(grep -cF -- "create_host_path: false" "$ACTIVE" || true)
          if [ "${COUNT:-0}" -ne 2 ]; then
            echo "  FAIL 期望恰好 2 处 create_host_path: false（config.json 与 ip.txt），实际 ${COUNT:-0}"
            echo "       （宿主路径缺失时 Docker 会创建同名目录，导致程序把目录当文件读写）"
            exit 1
          fi
          echo "  OK   create_host_path: false × $COUNT"

          if grep -qE "source: \.\." "$ACTIVE"; then
            echo "  FAIL 挂载源不应再出现 ../（已收口到 compose 同目录的 data/）"; exit 1
          fi
          echo "  OK   挂载源无 ../"

          echo "=== 默认（不设任何变量）==="
          docker compose -f deploy/docker-compose.yml config > /tmp/cfg-default.yml
          grep -E "^[[:space:]]+(image|pull_policy):" /tmp/cfg-default.yml || true
          assert_contains "ghcr.io/realkiro/cfnb-go:latest" /tmp/cfg-default.yml
          assert_contains "pull_policy: missing" /tmp/cfg-default.yml

          echo "=== 断言 compose 只拉取、不含 build 段 ==="
          if grep -qE "^[[:space:]]+build:" /tmp/cfg-default.yml; then
            echo "  FAIL compose 不应包含 build 段（镜像一律从 GHCR 拉取）"; exit 1
          fi
          echo "  OK   compose 无 build 段"

          echo "=== 渲染后的挂载块（仅打印供人工核对，不做断言）==="
          grep -nE "volumes:|source:|target:|bind:|create_host_path:" /tmp/cfg-default.yml || true

          echo "=== 覆盖变量 ==="
          CFNB_IMAGE=ghcr.io/example/cfnb-go:v9 CFNB_PULL_POLICY=never \
            docker compose -f deploy/docker-compose.yml config > /tmp/cfg-override.yml
          grep -E "^[[:space:]]+(image|pull_policy):" /tmp/cfg-override.yml || true
          assert_contains "ghcr.io/example/cfnb-go:v9" /tmp/cfg-override.yml
          assert_contains "pull_policy: never" /tmp/cfg-override.yml

          # 写入运行摘要，便于在 Actions 页面直接核对插值结果（无需登录查看日志）
          {
            echo "### compose 插值校验"
            echo
            echo '**默认（不设变量）**'
            echo '```yaml'
            grep -E "^[[:space:]]+(image|pull_policy):" /tmp/cfg-default.yml || true
            echo '```'
            echo '**覆盖变量（CFNB_IMAGE / CFNB_PULL_POLICY）**'
            echo '```yaml'
            grep -E "^[[:space:]]+(image|pull_policy):" /tmp/cfg-override.yml || true
            echo '```'
            echo
            echo '无 `build` 段 —— 镜像一律从 GHCR 拉取，本地不构建'
            echo
            echo '**挂载（源文件断言：长语法 + create_host_path: false）**'
            echo '```yaml'
            grep -vE "^[[:space:]]*#" deploy/docker-compose.yml | sed -n '/^    volumes:/,$p' || true
            echo '```'
            echo
            echo '宿主路径收口在 `deploy/data/`（compose 中写作单点相对路径 `./data/...`），'
            echo '`config.json` 与 `ip.txt` 均随仓库分发，克隆后 `docker compose up -d` 即可运行。'
            echo
            echo '> 注：`docker compose config` 的归一化输出不保留 `bind.create_host_path`，'
            echo '> 因此长语法相关断言全部在原始 compose 文件上做。'
          } >> "$GITHUB_STEP_SUMMARY"

  # ============ 阶段二：多架构构建并推送 GHCR（PR 时跳过）============
  docker:
    name: 构建并推送 GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成小写镜像名（GHCR 要求全小写）
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # 版本号采用日期标签（如 v2026.10.01）。这里不用 type=semver：
          # 日期里的 patch 段带前导零（.01），不是合法 semver，semver 解析会
          # 失败并静默跳过，导致推 tag 却不产出镜像标签。
          # type=match 对「纯标签名」做正则，v 前缀剥掉后得到 2026.10.01。
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha,prefix=sha-

      - name: 构建并推送（amd64 + arm64，Go 交叉编译无需 QEMU）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
