name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ============ 阶段一：静态检查 + 单元测试 + 交叉编译验证 ============
  test:
    name: 代码检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: go vet 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test -v ./...

      - name: 交叉编译验证（amd64 + arm64）
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/cfnb-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/cfnb-arm64 .
          ls -lh /tmp/cfnb-amd64 /tmp/cfnb-arm64

      - name: 二进制冒烟测试（版本与帮助输出）
        run: |
          mkdir -p /tmp/smoke && cp config.json /tmp/smoke/ && cp /tmp/cfnb-amd64 /tmp/smoke/cfnb
          cd /tmp/smoke
          ./cfnb --version
          ./cfnb --help | head -5

  # ============ 阶段二：多架构构建并推送 GHCR（PR 时跳过）============
  docker:
    name: 构建并推送 GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成小写镜像名（GHCR 要求全小写）
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: 构建并推送（amd64 + arm64，Go 交叉编译无需 QEMU）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
