name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ============ 阶段一：静态检查 + 单元测试 + 交叉编译验证 ============
  test:
    name: 代码检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: go vet 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test -v ./...

      - name: 交叉编译验证（amd64 + arm64）
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/cfnb-amd64 ./cmd/cfnb
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/cfnb-arm64 ./cmd/cfnb
          ls -lh /tmp/cfnb-amd64 /tmp/cfnb-arm64

      - name: 二进制冒烟测试（版本与帮助输出）
        run: |
          mkdir -p /tmp/smoke && cp deploy/app/config.json /tmp/smoke/ && cp /tmp/cfnb-amd64 /tmp/smoke/cfnb
          cd /tmp/smoke
          ./cfnb --version
          ./cfnb --help | head -5

      - name: 校验 compose 可解析（含变量默认值插值）
        run: |
          set -eu
          assert_contains() {
            if grep -q -- "$1" "$2"; then echo "  OK   $1"; else echo "  FAIL 期望包含: $1"; exit 1; fi
          }

          echo "=== 原始 compose 文件断言（剥掉注释行后做字面量匹配）==="
          # 断言对象选在源文件而非 `docker compose config` 输出上：
          # 归一化输出会改写字段（短语法被展开成长语法、相对路径变绝对路径），
          # 源文件才是构型的唯一真相。
          ACTIVE=/tmp/compose-active.yml
          grep -vE "^[[:space:]]*#" deploy/docker-compose.yml > "$ACTIVE"

          assert_active() {
            if grep -qF -- "$1" "$ACTIVE"; then echo "  OK   $1"; else echo "  FAIL 期望包含: $1"; exit 1; fi
          }

          # 短语法挂载，且宿主与容器路径同名：./app/<name> -> /app/<name>
          assert_active "- ./app/config.json:/app/config.json"
          assert_active "- ./app/ip.txt:/app/ip.txt"

          # 防回归一：不得退回长语法
          if grep -qE "type:[[:space:]]*bind|create_host_path:" "$ACTIVE"; then
            echo "  FAIL 挂载应使用短语法，不应出现 type: bind 或 create_host_path"; exit 1
          fi
          echo "  OK   未使用长语法"

          # 防回归二：不得使用跨目录相对路径 ../（已收口到 compose 同目录的 app/）
          if grep -qE "^[[:space:]]*-[[:space:]]*\.\./" "$ACTIVE"; then
            echo "  FAIL 挂载源不应出现 ../（已收口到 compose 同目录的 app/）"; exit 1
          fi
          echo "  OK   挂载源无 ../"

          echo "=== 默认（不设任何变量）==="
          docker compose -f deploy/docker-compose.yml config > /tmp/cfg-default.yml
          grep -E "^[[:space:]]+(image|pull_policy):" /tmp/cfg-default.yml || true
          assert_contains "ghcr.io/realkiro/cfnb-go:latest" /tmp/cfg-default.yml
          assert_contains "pull_policy: missing" /tmp/cfg-default.yml

          echo "=== 断言 compose 只拉取、不含 build 段 ==="
          if grep -qE "^[[:space:]]+build:" /tmp/cfg-default.yml; then
            echo "  FAIL compose 不应包含 build 段（镜像一律从 GHCR 拉取）"; exit 1
          fi
          echo "  OK   compose 无 build 段"

          echo "=== 渲染后的挂载块（compose 会把短语法展开成长语法，故只断言关键字段）==="
          grep -nE "volumes:|source:|target:|bind:|create_host_path:" /tmp/cfg-default.yml || true
          assert_contains "target: /app/config.json" /tmp/cfg-default.yml
          assert_contains "target: /app/ip.txt" /tmp/cfg-default.yml
          # source 被归一化成绝对路径，只断言末尾片段以保持跨机器兼容
          assert_contains "app/config.json" /tmp/cfg-default.yml
          assert_contains "app/ip.txt" /tmp/cfg-default.yml

          echo "=== 覆盖变量 ==="
          CFNB_IMAGE=ghcr.io/example/cfnb-go:v9 CFNB_PULL_POLICY=never \
            docker compose -f deploy/docker-compose.yml config > /tmp/cfg-override.yml
          grep -E "^[[:space:]]+(image|pull_policy):" /tmp/cfg-override.yml || true
          assert_contains "ghcr.io/example/cfnb-go:v9" /tmp/cfg-override.yml
          assert_contains "pull_policy: never" /tmp/cfg-override.yml

          # 写入运行摘要，便于在 Actions 页面直接核对插值结果（无需登录查看日志）
          {
            echo "### compose 插值校验"
            echo
            echo '**默认（不设变量）**'
            echo '```yaml'
            grep -E "^[[:space:]]+(image|pull_policy):" /tmp/cfg-default.yml || true
            echo '```'
            echo '**覆盖变量（CFNB_IMAGE / CFNB_PULL_POLICY）**'
            echo '```yaml'
            grep -E "^[[:space:]]+(image|pull_policy):" /tmp/cfg-override.yml || true
            echo '```'
            echo
            echo '无 `build` 段 —— 镜像一律从 GHCR 拉取，本地不构建'
            echo
            echo '**挂载（短语法：宿主 ./app/x <-> 容器 /app/x）**'
            echo '```yaml'
            grep -vE "^[[:space:]]*#" deploy/docker-compose.yml | sed -n '/^    volumes:/,$p' || true
            echo '```'
            echo
            echo '宿主路径收口在 `deploy/app/`（compose 中写作单点相对路径 `./app/...`），'
            echo '`config.json` 与 `ip.txt` 均随仓库分发，克隆后 `docker compose up -d` 即可运行。'
            echo
            echo '> 短语法在宿主路径缺失时会被 Docker 静默创建成同名目录，'
            echo '> 因此容器入口保留 `check_not_dir` 兜底检测（发现挂载点是目录即报错退出）。'
          } >> "$GITHUB_STEP_SUMMARY"

  # ============ 阶段二：多架构构建并推送 GHCR（PR 时跳过）============
  docker:
    name: 构建并推送 GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成小写镜像名（GHCR 要求全小写）
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # 版本号采用日期标签（如 v2026.10.01）。这里不用 type=semver：
          # 日期里的 patch 段带前导零（.01），不是合法 semver，semver 解析会
          # 失败并静默跳过，导致推 tag 却不产出镜像标签。
          # type=match 对「纯标签名」做正则，v 前缀剥掉后得到 2026.10.01。
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha,prefix=sha-

      - name: 计算注入二进制的版本号
        # 让容器里的 `cfnb --version` 能自证版本。tag 推送用日期版本（2026.10.01.7），
        # 其余（main / 手动）用 sha-<短SHA>，可反查 commit；二者都比默认值 1.0.0 有用。
        # 注意：release 的 imagetools 补标签不重新构建，故 :<日期版本> 镜像内部的
        # 版本号仍是构建时的 sha-<短SHA>，这是预期行为。
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "注入版本号: $VER"

      - name: 构建并推送（amd64 + arm64，Go 交叉编译无需 QEMU）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
