name: Release

# 发布策略：推送到 main 即自动发版，不再需要手动打 tag。
#
#   push main ──> CI（测试 / 交叉编译 / 推送 GHCR）──> 本工作流（仅当 CI 全绿）
#                                                        └─ 自动算版本号、建 tag、发 Release
#
# 几个刻意的设计：
#   1. 由 workflow_run 承接 CI 结果，而不是直接监听 push。
#      这样「测试没过就不发版」；同时 CI 的 docker 任务已先推送 sha-<短SHA> 镜像，
#      本工作流随后用已知的版本号重建一份镜像（见「用本次版本号重新构建镜像」步骤），
#      两者参照同一个 TARGET_SHA，不存在竞态。
#   2. 镜像是**重建**而不是「把 sha 镜像补打成版本标签」。补标签（imagetools create）
#      只改指向、不重新构建，而 CI 构建时注入的是 sha-<短SHA>（那一刻还不知道本次的
#      日期版本号），于是镜像里 `cfnb --version` 永远显示 sha-xxx，与 :<日期版本> 对不上。
#      改成用版本号重建后，标签与镜像内版本严格一致，并由「产物自证」步骤兜住回归。
#   3. 版本号取当天日期，同日再发自动追加序号：v2026.10.01 -> v2026.10.01.2 -> .3
#   4. tag 由本工作流用 GITHUB_TOKEN 创建并推送。GITHUB_TOKEN 触发的 push 事件
#      不会再触发新工作流，因此不会与下面的 push:tags 形成递归发布。
#   5. 校验「日期标签不能用 type=semver」的坑见 ci.yml 的 metadata 注释：
#      这里自建的 tag 走 push:tags 通道时，镜像版本标签依赖 ci.yml 的 type=match
#      —— 该通道由 CI 直接产出带正确版本号的镜像，故本工作流不再重建。
#   6. 只想跑 CI 不发版：**提交标题以 [skip release] 开头**。
#      刻意锚定标题开头而非「消息中任意位置出现」——否则任何在正文里解释这个标记的
#      提交（比如更新本文档的提交）都会把自己跳过，我们就这样误跳过一次发版。
#      另外只改 README/LICENSE 的提交连 CI 都不会触发（ci.yml 的 paths-ignore），自然也不发版。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v2026.10.02）；留空则按当天日期自动递增"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: 构建多平台二进制并发布
    runs-on: ubuntu-latest
    # 自动通道要求：CI 成功 + 是 main 的 push（排除 PR 与 tag）+ 标题未带跳过标记
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && !startsWith(github.event.workflow_run.head_commit.message, '[skip release]'))
    env:
      # workflow_run 事件下 github.sha 指向默认分支的**最新**提交，未必是触发那次 CI 的提交，
      # 所以统一在这里取一次被发布的 SHA，供 checkout / target_commitish / 镜像补标签复用。
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: 检出被发布的提交
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 确定版本标签（同日自动递增序号）
        id: tag
        run: |
          set -eu

          create_tag() {
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$1" -m "cfnb-go ${1#v}"
            git push origin "refs/tags/$1"
            echo "已创建并推送标签 $1"
          }

          if [ "${{ github.event_name }}" = "push" ]; then
            # 手动推 tag 的补发通道：直接用那个 tag
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag || '' }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            # 自动通道：按当天日期（东八区，与使用者的「今天」一致）生成标签
            BASE="v$(TZ=Asia/Shanghai date +%Y.%m.%d)"
            # 查远端已存在的同日标签：v2026.10.01（首版）/ v2026.10.01.2 / .3 ...
            EXISTING=$(git ls-remote --tags --refs origin "refs/tags/${BASE}*" | sed 's#.*refs/tags/##')
            MAX=0
            for t in $EXISTING; do
              case "$t" in
                "$BASE")   n=1 ;;
                "$BASE".*) n="${t##*.}" ;;
                *)         continue ;;
              esac
              if [ "$n" -eq "$n" ] 2>/dev/null && [ "$n" -gt "$MAX" ]; then MAX="$n"; fi
            done
            if [ "$MAX" -eq 0 ]; then TAG="$BASE"; else TAG="${BASE}.$((MAX + 1))"; fi
          fi

          # 手动指定/重复发布时标签可能已存在，此时直接复用它而不是报错
          if git ls-remote --tags --refs origin "refs/tags/$TAG" | grep -q .; then
            echo "标签 $TAG 已存在，直接复用它发布"
          else
            create_tag "$TAG"
          fi

          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "### 本次发布版本：\`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 交叉编译全部平台并打包（含 config.json）
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          mkdir -p dist

          # 每个压缩包内含「二进制 + config.json」，解压即可运行（程序读取二进制同目录的 config.json）
          CONFIG_SRC="deploy/app/config.json"
          [ -f "$CONFIG_SRC" ] || { echo "缺少 $CONFIG_SRC"; exit 1; }

          build() {
            os="$1"; arch="$2"; ext="$3"
            base="cfnb-${VERSION}-${os}-${arch}"
            stage="dist/.stage-${base}"
            rm -rf "$stage"; mkdir -p "$stage"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${stage}/${base}${ext}" ./cmd/cfnb
            cp "$CONFIG_SRC" "${stage}/config.json"

            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -q "../${base}.zip" "${base}${ext}" config.json)
            else
              (cd "$stage" && tar -czf "../${base}.tar.gz" "${base}${ext}" config.json)
            fi
            rm -rf "$stage"
          }

          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"

          # 产物自检：每个压缩包都必须含 config.json，否则文档里的「解压即用」就是假的
          echo "=== 校验每个产物均包含 config.json ==="
          for f in dist/*.tar.gz; do
            tar -tzf "$f" | grep -qx "config.json" || { echo "缺少 config.json: $f"; exit 1; }
            echo "  OK   $f"
          done
          for f in dist/*.zip; do
            unzip -l "$f" | grep -qE "[[:space:]]config\.json\$" || { echo "缺少 config.json: $f"; exit 1; }
            echo "  OK   $f"
          done

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

          echo "=== 产物 ==="
          ls -lh dist
          echo "=== 内容抽查（linux-amd64）==="
          tar -tzf "dist/cfnb-${VERSION}-linux-amd64.tar.gz"

      - name: 设置 Docker Buildx
        if: github.event_name != 'push'
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成小写镜像名（GHCR 要求全小写）
        if: github.event_name != 'push'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 用本次版本号重新构建镜像
        # 自动通道下 CI 只产出了 latest 与 sha-<短SHA>（构建时还不知道本次日期版本号），
        # 所以这里用已算出的版本号重建一份多架构镜像，让 :<版本> 与镜像内版本一致。
        # 开销很小：Go 交叉编译（arm64 无需 QEMU）+ GHA 层缓存复用，仅末层重建。
        # tag 通道不需要（ci.yml 的 type=match 已直接产出正确版本），故排除 push。
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.version }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 产物自证：镜像内 --version 必须等于本次版本号
        # 这一步是本次改造的回归护栏：只要有人把「重建」改回「补打标签」，
        # 镜像内版本就会退回 sha-xxx，此处立即红灯，而不是等用户拉下来才发现。
        if: github.event_name != 'push'
        run: |
          set -eu
          IMAGE="${{ steps.image.outputs.name }}"
          VERSION="${{ steps.tag.outputs.version }}"

          # 只取 amd64 单平台，避免在 arm64 runner 上多拉一份
          docker pull --quiet --platform linux/amd64 "${IMAGE}:${VERSION}"
          GOT=$(docker run --rm --platform linux/amd64 --entrypoint /app/cfnb \
                  "${IMAGE}:${VERSION}" --version | awk '{print $2}')
          echo "镜像内版本 = ${GOT}，期望 = ${VERSION}"
          if [ "$GOT" != "$VERSION" ]; then
            echo "::error::镜像内版本 ${GOT} 与发布版本 ${VERSION} 不一致"
            exit 1
          fi
          echo "  OK   ${IMAGE}:${VERSION} 内部版本自证通过"
          {
            echo "### 镜像版本自证"
            echo
            echo "\`${IMAGE}:${VERSION}\` 内执行 \`cfnb --version\` → \`cfnb-go ${GOT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 让 latest 指向本次版本镜像
        # 只在自动通道（main 的 push 触发）移动 latest，避免手动从其他分支
        # 跑 workflow_dispatch 时把 latest 回退成非 main 的构建。
        if: github.event_name == 'workflow_run'
        run: |
          set -eu
          IMAGE="${{ steps.image.outputs.name }}"
          VERSION="${{ steps.tag.outputs.version }}"

          # imagetools 在这里只是「移动标签指向」，被指向的镜像已是带正确版本的重建产物
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          echo "已将 \`${IMAGE}:latest\` 指向 \`${IMAGE}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:latest" | sed -n '1,6p'

      - name: 生成 Release 说明
        run: |
          cat > release-body.md <<EOF
          Cloudflare CDN 节点优选工具（Go 版）——零依赖静态二进制，无需 Python / curl / git。

          ## 📦 下载

          | 平台 | 架构 | 文件 |
          | :--- | :--- | :--- |
          | Linux | x86_64 | \`cfnb-${{ steps.tag.outputs.version }}-linux-amd64.tar.gz\` |
          | Linux | ARM64 | \`cfnb-${{ steps.tag.outputs.version }}-linux-arm64.tar.gz\` |
          | macOS | Intel | \`cfnb-${{ steps.tag.outputs.version }}-darwin-amd64.tar.gz\` |
          | macOS | Apple Silicon | \`cfnb-${{ steps.tag.outputs.version }}-darwin-arm64.tar.gz\` |
          | Windows | x64 | \`cfnb-${{ steps.tag.outputs.version }}-windows-amd64.zip\` |
          | Windows | ARM64 | \`cfnb-${{ steps.tag.outputs.version }}-windows-arm64.zip\` |

          ## 🚀 使用

          每个压缩包内含 **二进制 + \`config.json\`（带逐项注释的配置模板）**，解压后两者同目录，程序会自动读取。

          \`\`\`bash
          tar -xzf cfnb-${{ steps.tag.outputs.version }}-linux-amd64.tar.gz
          ./cfnb --version                # 应输出 cfnb-go ${{ steps.tag.outputs.version }}
          # 首次使用前：编辑同目录的 config.json（Cloudflare / WxPusher / GitHub 令牌）
          ./cfnb                          # 执行一次完整优选流程，结果写入同目录的 ip.txt
          \`\`\`

          不填任何令牌也能直接跑：程序会回退到内置默认值，只是不会推送通知、不改 DNS、不同步 GitHub。

          也可以用 Docker（镜像压缩后约 6.4 MB，支持 amd64 / arm64）：

          \`\`\`bash
          docker pull ghcr.io/realkiro/cfnb-go:latest
          docker pull ghcr.io/realkiro/cfnb-go:${{ steps.tag.outputs.version }}

          # 镜像标签与镜像内版本严格一致，可直接自证
          docker run --rm --entrypoint /app/cfnb ghcr.io/realkiro/cfnb-go:${{ steps.tag.outputs.version }} --version
          # cfnb-go ${{ steps.tag.outputs.version }}
          \`\`\`

          ## 🔐 校验下载完整性

          \`\`\`bash
          sha256sum -c checksums.txt --ignore-missing
          \`\`\`

          所有产物均由 GitHub Actions 在 CI 全绿后自动构建，无本地构建介入。
          EOF

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: cfnb-go ${{ steps.tag.outputs.version }}
          target_commitish: ${{ env.TARGET_SHA }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
