name: Release

# 打 tag（v2026.10.01 形式的日期标签）自动发布；也可在 Actions 页面手动指定 tag 触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v2026.10.01），不存在时会基于默认分支创建"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建多平台二进制并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 确定版本标签
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 交叉编译全部平台并打包（含 config.json）
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          mkdir -p dist

          # 每个压缩包内含「二进制 + config.json」，解压即可运行（程序读取二进制同目录的 config.json）
          CONFIG_SRC="deploy/app/config.json"
          [ -f "$CONFIG_SRC" ] || { echo "缺少 $CONFIG_SRC"; exit 1; }

          build() {
            os="$1"; arch="$2"; ext="$3"
            base="cfnb-${VERSION}-${os}-${arch}"
            stage="dist/.stage-${base}"
            rm -rf "$stage"; mkdir -p "$stage"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${stage}/${base}${ext}" ./cmd/cfnb
            cp "$CONFIG_SRC" "${stage}/config.json"

            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -q "../${base}.zip" "${base}${ext}" config.json)
            else
              (cd "$stage" && tar -czf "../${base}.tar.gz" "${base}${ext}" config.json)
            fi
            rm -rf "$stage"
          }

          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"

          # 产物自检：每个压缩包都必须含 config.json，否则文档里的「解压即用」就是假的
          echo "=== 校验每个产物均包含 config.json ==="
          for f in dist/*.tar.gz; do
            tar -tzf "$f" | grep -qx "config.json" || { echo "缺少 config.json: $f"; exit 1; }
            echo "  OK   $f"
          done
          for f in dist/*.zip; do
            unzip -l "$f" | grep -qE "[[:space:]]config\.json\$" || { echo "缺少 config.json: $f"; exit 1; }
            echo "  OK   $f"
          done

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

          echo "=== 产物 ==="
          ls -lh dist
          echo "=== 内容抽查（linux-amd64）==="
          tar -tzf "dist/cfnb-${VERSION}-linux-amd64.tar.gz"

      - name: 生成 Release 说明
        run: |
          cat > release-body.md <<EOF
          Cloudflare CDN 节点优选工具（Go 版）——零依赖静态二进制，无需 Python / curl / git。

          ## 📦 下载

          | 平台 | 架构 | 文件 |
          | :--- | :--- | :--- |
          | Linux | x86_64 | \`cfnb-${{ steps.tag.outputs.version }}-linux-amd64.tar.gz\` |
          | Linux | ARM64 | \`cfnb-${{ steps.tag.outputs.version }}-linux-arm64.tar.gz\` |
          | macOS | Intel | \`cfnb-${{ steps.tag.outputs.version }}-darwin-amd64.tar.gz\` |
          | macOS | Apple Silicon | \`cfnb-${{ steps.tag.outputs.version }}-darwin-arm64.tar.gz\` |
          | Windows | x64 | \`cfnb-${{ steps.tag.outputs.version }}-windows-amd64.zip\` |
          | Windows | ARM64 | \`cfnb-${{ steps.tag.outputs.version }}-windows-arm64.zip\` |

          ## 🚀 使用

          每个压缩包内含 **二进制 + \`config.json\`（带逐项注释的配置模板）**，解压后两者同目录，程序会自动读取。

          \`\`\`bash
          tar -xzf cfnb-${{ steps.tag.outputs.version }}-linux-amd64.tar.gz
          ./cfnb --version                # 应输出 cfnb-go ${{ steps.tag.outputs.version }}
          # 首次使用前：编辑同目录的 config.json（Cloudflare / WxPusher / GitHub 令牌）
          ./cfnb                          # 执行一次完整优选流程，结果写入同目录的 ip.txt
          \`\`\`

          不填任何令牌也能直接跑：程序会回退到内置默认值，只是不会推送通知、不改 DNS、不同步 GitHub。

          也可以用 Docker（镜像压缩后约 6.4 MB，支持 amd64 / arm64）：

          \`\`\`bash
          docker pull ghcr.io/realkiro/cfnb-go:latest
          \`\`\`

          ## 🔐 校验下载完整性

          \`\`\`bash
          sha256sum -c checksums.txt --ignore-missing
          \`\`\`

          所有产物均由 GitHub Actions 从本 tag 源码交叉编译，无本地构建介入。
          EOF

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: cfnb-go ${{ steps.tag.outputs.version }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
