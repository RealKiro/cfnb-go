name: Release

# 打 tag（v1.0.0 形式）自动发布；也可在 Actions 页面手动指定 tag 触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v1.0.0），不存在时会基于默认分支创建"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建多平台二进制并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 确定版本标签
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 交叉编译全部平台并打包
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          mkdir -p dist

          build() {
            os="$1"; arch="$2"; ext="$3"
            base="cfnb-${VERSION}-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${base}${ext}" ./cmd/cfnb
            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "${base}.zip" "${base}${ext}" && rm -f "${base}${ext}")
            else
              (cd dist && tar -czf "${base}.tar.gz" "${base}${ext}" && rm -f "${base}${ext}")
            fi
          }

          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
          ls -lh dist

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
