name: Release

# 发布策略：推送到 main 即自动发版，不再需要手动打 tag。
#
#   push main ──> CI（测试 / 交叉编译 / 推送 GHCR）──> 本工作流（仅当 CI 全绿）
#                                                        └─ 自动算版本号、建 tag、发 Release
#
# 几个刻意的设计：
#   1. 由 workflow_run 承接 CI 结果，而不是直接监听 push。
#      这样「测试没过就不发版」；同时 CI 的 docker 任务已经把 sha-<短SHA> 镜像推上去了，
#      补打版本镜像标签（见最后一个步骤）不会有竞态。
#   2. 版本号取当天日期，同日再发自动追加序号：v2026.10.01 -> v2026.10.01.2 -> .3
#   3. tag 由本工作流用 GITHUB_TOKEN 创建并推送。GITHUB_TOKEN 触发的 push 事件
#      不会再触发新工作流，因此不会与下面的 push:tags 形成递归发布。
#   4. 校验「日期标签不能用 type=semver」的坑见 ci.yml 的 metadata 注释：
#      这里自建的 tag 走 push:tags 通道时，镜像版本标签依赖 ci.yml 的 type=match。
#   5. 只想跑 CI 不发版：**提交标题以 [skip release] 开头**。
#      刻意锚定标题开头而非「消息中任意位置出现」——否则任何在正文里解释这个标记的
#      提交（比如更新本文档的提交）都会把自己跳过，我们就这样误跳过一次发版。
#      另外只改 README/LICENSE 的提交连 CI 都不会触发（ci.yml 的 paths-ignore），自然也不发版。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v2026.10.02）；留空则按当天日期自动递增"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: 构建多平台二进制并发布
    runs-on: ubuntu-latest
    # 自动通道要求：CI 成功 + 是 main 的 push（排除 PR 与 tag）+ 标题未带跳过标记
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && !startsWith(github.event.workflow_run.head_commit.message, '[skip release]'))
    env:
      # workflow_run 事件下 github.sha 指向默认分支的**最新**提交，未必是触发那次 CI 的提交，
      # 所以统一在这里取一次被发布的 SHA，供 checkout / target_commitish / 镜像补标签复用。
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: 检出被发布的提交
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 确定版本标签（同日自动递增序号）
        id: tag
        run: |
          set -eu

          create_tag() {
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$1" -m "cfnb-go ${1#v}"
            git push origin "refs/tags/$1"
            echo "已创建并推送标签 $1"
          }

          if [ "${{ github.event_name }}" = "push" ]; then
            # 手动推 tag 的补发通道：直接用那个 tag
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag || '' }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            # 自动通道：按当天日期（东八区，与使用者的「今天」一致）生成标签
            BASE="v$(TZ=Asia/Shanghai date +%Y.%m.%d)"
            # 查远端已存在的同日标签：v2026.10.01（首版）/ v2026.10.01.2 / .3 ...
            EXISTING=$(git ls-remote --tags --refs origin "refs/tags/${BASE}*" | sed 's#.*refs/tags/##')
            MAX=0
            for t in $EXISTING; do
              case "$t" in
                "$BASE")   n=1 ;;
                "$BASE".*) n="${t##*.}" ;;
                *)         continue ;;
              esac
              if [ "$n" -eq "$n" ] 2>/dev/null && [ "$n" -gt "$MAX" ]; then MAX="$n"; fi
            done
            if [ "$MAX" -eq 0 ]; then TAG="$BASE"; else TAG="${BASE}.$((MAX + 1))"; fi
          fi

          # 手动指定/重复发布时标签可能已存在，此时直接复用它而不是报错
          if git ls-remote --tags --refs origin "refs/tags/$TAG" | grep -q .; then
            echo "标签 $TAG 已存在，直接复用它发布"
          else
            create_tag "$TAG"
          fi

          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "### 本次发布版本：\`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 交叉编译全部平台并打包（含 config.json）
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          mkdir -p dist

          # 每个压缩包内含「二进制 + config.json」，解压即可运行（程序读取二进制同目录的 config.json）
          CONFIG_SRC="deploy/app/config.json"
          [ -f "$CONFIG_SRC" ] || { echo "缺少 $CONFIG_SRC"; exit 1; }

          build() {
            os="$1"; arch="$2"; ext="$3"
            base="cfnb-${VERSION}-${os}-${arch}"
            stage="dist/.stage-${base}"
            rm -rf "$stage"; mkdir -p "$stage"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${stage}/${base}${ext}" ./cmd/cfnb
            cp "$CONFIG_SRC" "${stage}/config.json"

            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -q "../${base}.zip" "${base}${ext}" config.json)
            else
              (cd "$stage" && tar -czf "../${base}.tar.gz" "${base}${ext}" config.json)
            fi
            rm -rf "$stage"
          }

          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"

          # 产物自检：每个压缩包都必须含 config.json，否则文档里的「解压即用」就是假的
          echo "=== 校验每个产物均包含 config.json ==="
          for f in dist/*.tar.gz; do
            tar -tzf "$f" | grep -qx "config.json" || { echo "缺少 config.json: $f"; exit 1; }
            echo "  OK   $f"
          done
          for f in dist/*.zip; do
            unzip -l "$f" | grep -qE "[[:space:]]config\.json\$" || { echo "缺少 config.json: $f"; exit 1; }
            echo "  OK   $f"
          done

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

          echo "=== 产物 ==="
          ls -lh dist
          echo "=== 内容抽查（linux-amd64）==="
          tar -tzf "dist/cfnb-${VERSION}-linux-amd64.tar.gz"

      - name: 为本次版本补打 GHCR 镜像标签
        # 自动通道下 CI 只产出了 latest 与 sha-<短SHA>，这里把 sha 镜像补打成版本标签，
        # 让 ghcr.io/...:<版本> 与 Release 一一对应。
        # tag 通道不需要（ci.yml 的 type=match 已直接产出），故排除 push。
        if: github.event_name != 'push'
        run: |
          set -eu
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${{ steps.tag.outputs.version }}"
          SRC="${IMAGE}:sha-$(echo "${{ env.TARGET_SHA }}" | cut -c1-7)"

          # CI 全绿是本 job 的前置条件，所以 sha 镜像必然已存在；查不到就说明假设被打破，直接失败
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx version
          docker buildx imagetools inspect "$SRC" > /dev/null
          echo "  OK   找到 CI 产出的镜像 $SRC"

          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "$SRC"
          echo "  OK   已补打 ${IMAGE}:${VERSION}"
          echo "已将 \`${SRC}\` 补打为 \`${IMAGE}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 生成 Release 说明
        run: |
          cat > release-body.md <<EOF
          Cloudflare CDN 节点优选工具（Go 版）——零依赖静态二进制，无需 Python / curl / git。

          ## 📦 下载

          | 平台 | 架构 | 文件 |
          | :--- | :--- | :--- |
          | Linux | x86_64 | \`cfnb-${{ steps.tag.outputs.version }}-linux-amd64.tar.gz\` |
          | Linux | ARM64 | \`cfnb-${{ steps.tag.outputs.version }}-linux-arm64.tar.gz\` |
          | macOS | Intel | \`cfnb-${{ steps.tag.outputs.version }}-darwin-amd64.tar.gz\` |
          | macOS | Apple Silicon | \`cfnb-${{ steps.tag.outputs.version }}-darwin-arm64.tar.gz\` |
          | Windows | x64 | \`cfnb-${{ steps.tag.outputs.version }}-windows-amd64.zip\` |
          | Windows | ARM64 | \`cfnb-${{ steps.tag.outputs.version }}-windows-arm64.zip\` |

          ## 🚀 使用

          每个压缩包内含 **二进制 + \`config.json\`（带逐项注释的配置模板）**，解压后两者同目录，程序会自动读取。

          \`\`\`bash
          tar -xzf cfnb-${{ steps.tag.outputs.version }}-linux-amd64.tar.gz
          ./cfnb --version                # 应输出 cfnb-go ${{ steps.tag.outputs.version }}
          # 首次使用前：编辑同目录的 config.json（Cloudflare / WxPusher / GitHub 令牌）
          ./cfnb                          # 执行一次完整优选流程，结果写入同目录的 ip.txt
          \`\`\`

          不填任何令牌也能直接跑：程序会回退到内置默认值，只是不会推送通知、不改 DNS、不同步 GitHub。

          也可以用 Docker（镜像压缩后约 6.4 MB，支持 amd64 / arm64）：

          \`\`\`bash
          docker pull ghcr.io/realkiro/cfnb-go:latest
          docker pull ghcr.io/realkiro/cfnb-go:${{ steps.tag.outputs.version }}
          \`\`\`

          ## 🔐 校验下载完整性

          \`\`\`bash
          sha256sum -c checksums.txt --ignore-missing
          \`\`\`

          所有产物均由 GitHub Actions 在 CI 全绿后自动构建，无本地构建介入。
          EOF

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: cfnb-go ${{ steps.tag.outputs.version }}
          target_commitish: ${{ env.TARGET_SHA }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
