# docker-compose.yml
# 使用前确保当前目录存在 config.json（仓库自带，改好令牌即可）
# ip.txt 若不存在请先执行：touch ip.txt
#
# 镜像名不写死：通过环境变量 CFNB_IMAGE 注入（支持 .env 文件，参考 .env.example）
#   - 修改同目录下 .env:  CFNB_IMAGE=ghcr.io/<你的用户名>/cfnb-go:latest
#   - 或启动时临时指定:   CFNB_IMAGE=xxx docker compose up -d
#   - 未设置时回退为本地构建（build: .）
#
# 快速启动：docker compose up -d
# 查看日志：docker compose logs -f

services:
  cfnb:
    # 未设置 CFNB_IMAGE 时，使用下方 build 本地构建并打标签 cfnb-go:local
    image: ${CFNB_IMAGE:-cfnb-go:local}
    build: .
    container_name: cfnb-go
    restart: unless-stopped
    environment:
      - RUN_INTERVAL=300              # 每 5 分钟运行一次；0 = 只运行一次
      - TZ=Asia/Shanghai
    volumes:
      - ./config.json:/app/config.json                # 主配置（含 Cloudflare / WxPusher / GitHub 令牌）
      - ./ip.txt:/app/ip.txt                          # 优选结果持久化
      # - ./valid_tokens.txt:/app/valid_tokens.txt    # 启用 IP 地区校准时取消注释
      # - ./ipinfo_cache.txt:/app/ipinfo_cache.txt    # 启用 IP 地区校准时取消注释
